# openspec/config.yaml
schema: spec-driven

context: |
  Product: Menu-now, a digital menu with ordering for neighborhood cafés and bars.
  Roles: owner (manages the menu and venue settings), staff (receives and manages
  orders), diner (browses the menu and places orders).
  No role has a technical background: plain language, short flows, mobile-first.

  Stack: React 19 + TanStack Query + SCSS + TypeScript with Vite (SPA). Backend: Supabase (Postgres, Auth, RLS).
  Testing: Vitest + React Testing Library (unit/integration), Playwright (e2e).
  Deployment: one instance per venue (frontend + its own Supabase project).
  Not multi-tenant: the code does not model multiple venues in a single database.
  Languages: UI in Spanish (default) and English.
  Payments: any payment gateway is out of scope. The app does not process payments.

  Non-negotiable rules:
  1. Simplicity first: this is an app for a neighborhood café, not a platform.
     Given two solutions, always pick the simpler one.
  2. Privacy by design: the diner NEVER registers or provides personal data.
     An order is tied to a table, never to a person.
  3. The spec is the source of truth: every change to the system's observable
     behavior must go through an OpenSpec change (proposal + deltas) or be
     regularized as one. Behavior not described in openspec/specs/ is a defect,
     even if the code works.
  4. Real accessibility: the menu is used by older people on a phone in bright
     sunlight: readable typography, high contrast, large buttons. Allergens are
     always shown visibly (legal requirement).

# Per-artifact rules: injected only when generating that artifact.
rules:
  proposal:
    - State which roles the change affects (owner, staff, diner)
    - Record every business decision in proposal.md with its date
  specs:
    - Write in Spanish or English, keeping each requirement's normative keyword
      in English (MUST/SHALL), e.g. "The system MUST display all active dishes"
    - Reuse terms already defined in the living specs; do not introduce new
      synonyms for existing concepts
    - Write each scenario from the perspective of a specific role
    - No implementation decisions; those belong in design
    - es/en support is cross-cutting; do not duplicate scenarios per language
  design:
    - If the change touches the Supabase schema, include the migration and RLS policies
    - State whether the change requires manual action on each deployed instance
    - All user-facing text must exist in both es and en
    - No new dependency without written justification
  tasks:
    - Every spec scenario is covered by at least one test, and the task names which one
    - Use Playwright only for cross-role flows (e.g. diner orders → staff receives)

operations:
  apply:
    guidance:
      - Run tests for the affected files before the full suite